name: release

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      tag:
        description: The existing tag to package or republish.
        required: true
        type: string
      publish:
        description: Publish the GitHub release before building downstream packages.
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  test-release-source:
    name: Test release source (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Check out exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Linux test dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev libudev-dev

      - name: Run release-source tests
        run: go test -count=1 -timeout=10m ./...

      - name: Run race detector
        if: runner.os == 'Linux'
        run: go test -race -count=1 -timeout=10m ./...

  validate:
    name: Validate release configuration
    needs: [test-release-source]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate GoReleaser configurations
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.1.0
        with:
          version: v2.12.7
          args: check --config .goreleaser.ubuntu-latest.yml

      - name: Validate macOS release configuration
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.1.0
        with:
          version: v2.12.7
          args: check --config .goreleaser.macos-latest.yml

      - name: Validate Linux release configuration
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.1.0
        with:
          version: v2.12.7
          args: check --config .goreleaser.ubuntu-22.04.yml

      - name: Build snapshot artifacts
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.1.0
        with:
          version: v2.12.7
          args: release --snapshot --clean --skip=publish --config .goreleaser.ubuntu-latest.yml

      - name: Smoke check snapshot artifacts
        shell: bash
        run: |
          shopt -s nullglob
          artifacts=(dist/*.zip dist/*.tar.gz)
          if (( ${#artifacts[@]} == 0 )); then
            echo "GoReleaser produced no archive artifacts." >&2
            exit 1
          fi
          binary=dist/saml2aws_linux_amd64_v1/saml2aws
          if [[ ! -x "$binary" ]]; then
            echo "GoReleaser produced no runnable Linux amd64 binary." >&2
            exit 1
          fi
          scripts/release-smoke-test.sh --binary "$binary" "${artifacts[@]}"

      - name: Upload snapshot artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-snapshot-${{ github.run_id }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  release:
    name: release
    strategy:
      # the goreleaser and the Github release API doesn't handle concurrent
      # access well, so run goreleaser serially
      max-parallel: 1
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-22.04
          - macos-latest
    runs-on: ${{ matrix.os }}
    needs: [validate]
    if: >-
      needs.validate.result == 'success' &&
      (github.event_name != 'workflow_dispatch' || inputs.publish)
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up Go 1.x
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"

      - name: Install dependency required for linux builds
        if: matrix.os == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev

      - name: Add Lowercase Repository Name to Environment
        run: |
          repository_name_lowercase=$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          echo "REPOSITORY_NAME_LOWERCASE=$repository_name_lowercase" >> "$GITHUB_ENV"

      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.4.0
        if: matrix.os == 'ubuntu-22.04'
        with:
          registry: "ghcr.io"
          username: "${{ github.actor }}"
          password: "${{ secrets.GITHUB_TOKEN }}"

      - name: GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.1.0
        with:
          version: v2.12.7
          args: release --clean --config .goreleaser.${{ matrix.os }}.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_NAME: ${{ env.REPOSITORY_NAME_LOWERCASE }}

  windows-msi:
    name: Build Windows MSI and upload to release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: [validate, release]
    if: >- # https://github.com/actions/runner/issues/491
      always() &&
      needs.validate.result == 'success' &&
      (needs.release.result == 'success' || needs.release.result == 'skipped')
    env:
      INSTALLER: ${{ github.workspace }}/.github/win-msi
      BIN: ${{ github.workspace }}/.github/win-msi/src/bin
      WIXIMG: dactiv/wix@sha256:17d232708589641f5632f9a1ff9463ad087b192cea7b8e6012d2b47ec6af5f6c
    steps:
      - name: Normalize tag values
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] ; then
              VER=${INPUT_TAG}
          else
              VER=${GITHUB_REF#refs/tags/}
          fi

          VERSION=${VER#v}

          {
            echo "VER_TAG=$VER"
            echo "VERSION=$VERSION"
            echo "ASSET=saml2aws_${VERSION}_windows_amd64.zip"
          } >> "$GITHUB_ENV"

      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Retrieve the release asset
        id: asset
        uses: robinraju/release-downloader@a96f54c1b5f5e09e47d9504526e96febd949d4c2 # v1.11
        with:
          repository: ${{ github.repository }}
          tag: ${{ env.VER_TAG }}
          fileName: ${{ env.ASSET }}
          out-file-path: ${{ env.BIN }}

      - name: Unzip asset
        working-directory: ${{ env.BIN }}
        run: unzip "${ASSET}"

      - name: Build MSI
        run: |
          # container does not run as root
          chmod -R o+rw "${INSTALLER}"

          docker run --rm -i -e VERSION -v "${INSTALLER}:/wix" "${WIXIMG}" /bin/sh < "${INSTALLER}/wix.sh"

      - name: Upload the asset to the release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v0.2.2.1.2.2.15 / v2.2.1
        with:
          tag_name: ${{ env.VER_TAG }}
          files: ${{ env.INSTALLER }}/out/*.msi

  chocolatey:
    name: Deploy to chocolatey
    runs-on: windows-latest
    permissions:
      contents: write
    needs: [validate, release]
    if: >- # https://github.com/actions/runner/issues/491
      always() &&
      needs.validate.result == 'success' &&
      (needs.release.result == 'success' || needs.release.result == 'skipped')
    steps:
      - name: Normalize tag values
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] ; then
              VER=${INPUT_TAG}
          else
              VER=${GITHUB_REF#refs/tags/}
          fi

          VERSION=${VER#v}

          {
            echo "VER_TAG=$VER"
            echo "VERSION=$VERSION"
          } >> "$GITHUB_ENV"

      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup PowerShell module cache
        id: cacher
        uses: actions/cache@6849a6489940f00c2f30c0fb92c6274307ccb58a # v4.1.2
        with:
          path: "C:\\Users\\runneradmin\\Documents\\PowerShell\\Modules"
          key: ${{ runner.os }}-InvokeBuild

      - name: Install required PowerShell modules
        if: steps.cacher.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module InvokeBuild -ErrorAction Stop

      - name: Invoke build script
        env:
          appName: saml2aws
        shell: pwsh
        run: Invoke-Build

      - name: Deploy
        shell: pwsh
        env:
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
          VERSION: ${{ env.VERSION }}
        run: |
          choco apikey --key "$env:CHOCOLATEY_API_KEY" --source "https://push.chocolatey.org/"
          choco push ./choco/saml2aws.${env:VERSION}.nupkg --source "https://push.chocolatey.org/"
