name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GOFLAGS: -mod=readonly

jobs:
  test-linux:
    name: Test (Linux)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Linux test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev libudev-dev
          go run github.com/mxschmitt/playwright-go/cmd/playwright@v0.6100.0 install --with-deps chromium

      - name: Test with coverage and race detection
        run: go test -race -count=1 -timeout=10m -covermode=atomic -coverprofile=coverage.out ./...

      - name: Require coverage floor
        run: scripts/check-coverage.sh coverage.out 50.0

      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-linux-amd64
          path: coverage.out
          if-no-files-found: error
          retention-days: 7

  test-native:
    name: Test (${{ matrix.os }})
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: true

      - name: Install Playwright test browser
        run: go run github.com/mxschmitt/playwright-go/cmd/playwright@v0.6100.0 install chromium

      - name: Run tests
        run: go test -count=1 -timeout=10m ./...

  security:
    name: Trivy
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan dependencies for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          scan-type: fs
          scan-ref: .
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: "false"
          exit-code: "1"

  opengrep:
    name: OpenGrep
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install OpenGrep
        env:
          OPENGREP_VERSION: v1.30.0
          OPENGREP_SHA256: 35779bdd72e92129c8df2a77f0c55e8c08356801ea92591ef32108d6b28d564c
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 --proto '=https' --tlsv1.2 \
            --output "${RUNNER_TEMP}/opengrep" \
            "https://github.com/opengrep/opengrep/releases/download/${OPENGREP_VERSION}/opengrep_manylinux_x86"
          echo "${OPENGREP_SHA256}  ${RUNNER_TEMP}/opengrep" | sha256sum --check --strict
          chmod 0755 "${RUNNER_TEMP}/opengrep"
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      - name: Verify OpenGrep installation
        run: opengrep --version

      - name: Scan repository and create SARIF report
        run: |
          mkdir -p opengrep-results
          opengrep scan \
            --config p/default \
            --config p/secrets \
            --strict \
            --taint-intrafile \
            --disable-version-check \
            --sarif-output=opengrep-results/repository.sarif \
            .

      - name: Scan Dockerfile.build and create SARIF report
        run: |
          opengrep scan \
            --config p/dockerfile \
            --scan-unknown-extensions \
            --strict \
            --disable-version-check \
            --sarif-output=opengrep-results/dockerfile-build.sarif \
            Dockerfile.build

      - name: Block newly introduced high-severity findings
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        env:
          BASELINE_COMMIT: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          opengrep scan \
            --config p/default \
            --config p/secrets \
            --severity ERROR \
            --baseline-commit "${BASELINE_COMMIT}" \
            --strict \
            --taint-intrafile \
            --error \
            --disable-version-check \
            .
          opengrep scan \
            --config p/dockerfile \
            --severity ERROR \
            --baseline-commit "${BASELINE_COMMIT}" \
            --scan-unknown-extensions \
            --strict \
            --error \
            --disable-version-check \
            Dockerfile.build

      - name: Add OpenGrep findings to the job summary
        if: always() && hashFiles('opengrep-results/*.sarif') != ''
        shell: bash
        run: |
          set -euo pipefail
          findings=$(jq -s '[.[] | .runs[]? as $run |
            ($run.tool.driver.rules // [] | map({key: .id, value: (.defaultConfiguration.level // "warning")}) | from_entries) as $levels |
            $run.results[]? | . + {level: (.level // $levels[.ruleId] // "warning")}
          ]' opengrep-results/*.sarif)
          count=$(jq 'length' <<< "${findings}")
          {
            echo "## OpenGrep findings"
            echo
            echo "OpenGrep reported **${count}** finding(s). The complete, navigable results are published in GitHub Code Scanning."
            if (( count > 0 )); then
              echo
              echo "| Severity | Rule | Location | Message |"
              echo "| --- | --- | --- | --- |"
              jq -r '.[:50][] | [
                (.level // "warning" | ascii_upcase),
                (.ruleId // "unknown" | gsub("[|`\\r\\n]"; " ")),
                (((.locations[0].physicalLocation.artifactLocation.uri // "unknown") + ":" + ((.locations[0].physicalLocation.region.startLine // 1) | tostring)) | gsub("[|`\\r\\n]"; " ")),
                ((.message.text // "") | gsub("[|`\\r\\n]"; " "))
              ] | @tsv' <<< "${findings}" |
                while IFS=$'\t' read -r severity rule location message; do
                  printf '| %s | `%s` | `%s` | %s |\n' "${severity}" "${rule}" "${location}" "${message}"
                done
              if (( count > 50 )); then
                echo
                echo "Showing the first 50 findings. Use GitHub Code Scanning for the complete list."
              fi
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Publish repository findings to GitHub Code Scanning
        if: >-
          always() &&
          hashFiles('opengrep-results/repository.sarif') != '' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: opengrep-results/repository.sarif
          category: opengrep/repository

      - name: Publish Dockerfile.build findings to GitHub Code Scanning
        if: >-
          always() &&
          hashFiles('opengrep-results/dockerfile-build.sarif') != '' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: opengrep-results/dockerfile-build.sarif
          category: opengrep/dockerfile-build

      - name: Upload OpenGrep SARIF
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opengrep-results
          path: opengrep-results/*.sarif
          if-no-files-found: warn
          retention-days: 7

  lint:
    name: Lint
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Linux lint dependencies
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev libudev-dev

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@d583c34f0599d37dbac4a198b9c83201be380893 # v9.3.0
        with:
          version: v2.13.2
          args: --timeout=5m

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: arm
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        shell: bash
        run: |
          suffix=""
          if [[ "${GOOS}" == "windows" ]]; then
            suffix=".exe"
          fi
          mkdir -p dist
          go build -trimpath \
            -ldflags "-s -w -X main.Version=ci -X main.commit=${GITHUB_SHA} -X main.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o "dist/saml2aws_${GOOS}_${GOARCH}${suffix}" \
            ./cmd/saml2aws

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: saml2aws-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  ci-success:
    name: CI success
    if: always() && github.event_name != 'schedule'
    needs: [test-linux, test-native, security, opengrep, lint, build]
    runs-on: ubuntu-latest
    steps:
      - name: Require every pull request check
        env:
          TEST_LINUX: ${{ needs.test-linux.result }}
          TEST_NATIVE: ${{ needs.test-native.result }}
          SECURITY: ${{ needs.security.result }}
          OPENGREP: ${{ needs.opengrep.result }}
          LINT: ${{ needs.lint.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          for result in "$TEST_LINUX" "$TEST_NATIVE" "$SECURITY" "$OPENGREP" "$LINT" "$BUILD"; do
            if [[ "$result" != "success" ]]; then
              echo "A required CI job did not succeed: $result" >&2
              exit 1
            fi
          done
