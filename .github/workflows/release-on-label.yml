name: Prepare and publish a labeled release

on:
  pull_request_target:
    types: [labeled, closed]

permissions: {}

concurrency:
  group: release-label-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Add the release changelog commit
    if: >-
      github.event.action == 'labeled' &&
      github.event.label.name == 'release' &&
      github.event.pull_request.merged == false &&
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
    steps:
      - name: Check out the pull request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Prepare the next patch release
        id: version
        run: |
          tag=$(git show "${BASE_SHA}:.github/scripts/prepare-release.sh" | bash -s -- CHANGELOG.md "${REPOSITORY_URL}")
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Commit and push the changelog
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add CHANGELOG.md
          git commit -m "chore(release): prepare ${TAG}"
          git push origin "HEAD:${HEAD_REF}"

  publish:
    name: Tag and start the publisher
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      contains(github.event.pull_request.labels.*.name, 'release')
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      MERGE_COMMIT: ${{ github.event.pull_request.merge_commit_sha }}
    steps:
      - name: Check out the merged release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Read and validate the prepared version
        id: version
        run: |
          tag=$(awk '/^## \[[0-9]+\.[0-9]+\.[0-9]+\] - / { version=$2; gsub(/[\[\]]/, "", version); print "v" version; exit }' CHANGELOG.md)
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "CHANGELOG.md does not contain a prepared semantic version." >&2
            exit 1
          fi
          latest_tag=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
          if [[ ! "${latest_tag}" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Unable to determine the latest semantic-version tag." >&2
            exit 1
          fi
          patch=$((${BASH_REMATCH[3]} + 1))
          expected_tag="v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${patch}"
          if [[ "${tag}" != "${expected_tag}" ]]; then
            echo "Expected the prepared release to be ${expected_tag}, got ${tag}." >&2
            exit 1
          fi
          if git rev-parse --verify --quiet "refs/tags/${tag}"; then
            echo "${tag} already exists." >&2
            exit 1
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Create and push the release tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git tag --annotate "${TAG}" "${MERGE_COMMIT}" --message "Release ${TAG}"
          git push origin "refs/tags/${TAG}"

      - name: Start the release publisher
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: gh workflow run release.yml --ref "${TAG}" --field tag="${TAG}" --field publish=true
